<!DOCTYPE html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Trang Đăng Ký</title>

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<style>
    body {
        background-color: #f8f9fa;
    }

    .register-container {
        max-width: 650px;
        margin: 50px auto;
    }

    .register-card {
        border: none;
        border-radius: 15px;
    }
</style>
```

</head>

<body>

```
<!-- ================= FORM ĐĂNG KÝ ================= -->
<div class="container register-container">

    <div class="card register-card shadow">

        <div class="card-body p-4 p-md-5">

            <!-- Tiêu đề -->
            <div class="text-center mb-4">

                <h1 class="fw-bold">
                    Đăng Ký Tài Khoản
                </h1>

                <p class="text-muted">
                    Vui lòng điền đầy đủ thông tin bên dưới
                </p>

            </div>


            <!-- Form -->
            <form>

                <!-- Họ và tên -->
                <div class="mb-3">

                    <label for="fullname" class="form-label">
                        Họ và tên
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="fullname"
                        placeholder="Nhập họ và tên"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>


                <!-- Mật khẩu -->
                <div class="mb-3">

                    <label for="password" class="form-label">
                        Mật khẩu
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Nhập mật khẩu"
                        required
                    >

                </div>


                <!-- Xác nhận mật khẩu -->
                <div class="mb-3">

                    <label for="confirmPassword" class="form-label">
                        Xác nhận mật khẩu
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        placeholder="Nhập lại mật khẩu"
                        required
                    >

                </div>


                <!-- Giới tính -->
                <div class="mb-3">

                    <label class="form-label d-block">
                        Giới tính
                    </label>

                    <div class="form-check form-check-inline">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="gender"
                            id="male"
                            value="Nam"
                        >

                        <label class="form-check-label" for="male">
                            Nam
                        </label>

                    </div>


                    <div class="form-check form-check-inline">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="gender"
                            id="female"
                            value="Nữ"
                        >

                        <label class="form-check-label" for="female">
                            Nữ
                        </label>

                    </div>


                    <div class="form-check form-check-inline">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="gender"
                            id="other"
                            value="Khác"
                        >

                        <label class="form-check-label" for="other">
                            Khác
                        </label>

                    </div>

                </div>


                <!-- Sở thích -->
                <div class="mb-3">

                    <label class="form-label d-block">
                        Sở thích
                    </label>

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="reading"
                            name="hobbies"
                            value="Đọc sách"
                        >

                        <label class="form-check-label" for="reading">
                            Đọc sách
                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="music"
                            name="hobbies"
                            value="Âm nhạc"
                        >

                        <label class="form-check-label" for="music">
                            Âm nhạc
                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="sports"
                            name="hobbies"
                            value="Thể thao"
                        >

                        <label class="form-check-label" for="sports">
                            Thể thao
                        </label>

                    </div>

                </div>


                <!-- Quốc gia -->
                <div class="mb-4">

                    <label for="country" class="form-label">
                        Quốc gia
                    </label>

                    <select
                        class="form-select"
                        id="country"
                        required
                    >

                        <option value="" selected>
                            -- Chọn quốc gia --
                        </option>

                        <option value="vietnam">
                            Việt Nam
                        </option>

                        <option value="japan">
                            Nhật Bản
                        </option>

                        <option value="korea">
                            Hàn Quốc
                        </option>

                        <option value="usa">
                            Hoa Kỳ
                        </option>

                        <option value="uk">
                            Anh
                        </option>

                    </select>

                </div>


                <!-- Nút Submit -->
                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg"
                    >
                        Đăng Ký
                    </button>

                </div>

            </form>


            <!-- Ghi chú -->
            <p class="text-center text-muted mt-4 mb-0">
                Bằng việc đăng ký, bạn đồng ý với các điều khoản
                sử dụng của chúng tôi.
            </p>

        </div>

    </div>

</div>


<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
```

</body>
</html>
