<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Manager | Quên mật khẩu</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/login.css?v=20261005-sakura-v16" />
  </head>
  <body class="login-page">
    <main class="auth-layout">
      <section class="brand-panel">
        <div class="brand-copy">
          <h1>Hotel Manager</h1>
          <p class="brand-subtitle">Quản lý khách sạn</p>
          <p class="brand-description">
            Khôi phục mật khẩu nhanh chóng, an toàn và dễ dàng.
          </p>
        </div>
      </section>

      <section class="auth-panel">
        <div class="auth-card">
          <div class="auth-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 42h36M10 42V14l14-7 14 7v28M18 42V30h12v12"/>
              <path d="M16 18h3m10 0h3M16 24h3m10 0h3M23 15v3m0 6v3"/>
              <path d="M20 12V7h8v5"/>
            </svg>
          </div>

          <div class="auth-brand-block">
            <h2 class="auth-brand-name">Hotel Manager</h2>
            <p class="auth-brand-subtitle">Quản lý khách sạn</p>
          </div>

          <h3 class="auth-title">Quên mật khẩu</h3>
          <p class="auth-subtitle">Nhập thông tin tài khoản để xác thực và đổi mật khẩu mới.</p>

          <form id="forgot-password-form" class="login-form">
            <div class="field-group">
              <label for="fp-username">Tên đăng nhập</label>
              <div class="input-wrap">
                <span class="field-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 6 9 7 9-7"/></svg>
                </span>
                <input id="fp-username" name="username" type="text" autocomplete="username" placeholder="Nhập tên đăng nhập" required />
              </div>
            </div>

            <div class="field-group">
              <label for="fp-phone">Số điện thoại</label>
              <div class="input-wrap">
                <span class="field-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07A19.5 19.5 0 0 1 3.07 9.8 2 2 0 0 1 5.06 7.8h3a2 2 0 0 1 2 1.72l.4 2.34a2 2 0 0 1-.57 1.79l-1.3 1.3a16 16 0 0 0 7.28 7.28l1.3-1.3a2 2 0 0 1 1.79-.57l2.34.4A2 2 0 0 1 22 16.92Z"/></svg>
                </span>
                <input id="fp-phone" name="phone" type="tel" autocomplete="tel" placeholder="Nhập số điện thoại" required />
              </div>
            </div>

            <div id="otp-step" class="otp-step hidden">
              <div class="field-group">
                <label for="fp-otp">Mã OTP</label>
                <div class="input-wrap">
                  <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21V8.5A2.5 2.5 0 0 1 9.5 6H15a3 3 0 0 1 3 3v12"/><path d="M9 11h6M9 15h6M5 21h14"/></svg></span>
                  <input id="fp-otp" name="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Nhập mã OTP 6 chữ số" />
                </div>
              </div>
              <p id="fp-otp-note" class="otp-note"></p>
            </div>

            <div id="new-password-step" class="otp-step hidden">
              <div class="field-group">
                <label for="fp-new-password">Mật khẩu mới</label>
                <div class="input-wrap">
                  <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></svg></span>
                  <input id="fp-new-password" name="newPassword" type="password" placeholder="Nhập mật khẩu mới" minlength="8" />
                </div>
              </div>

              <div class="field-group">
                <label for="fp-confirm-password">Xác nhận mật khẩu mới</label>
                <div class="input-wrap">
                  <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></svg></span>
                  <input id="fp-confirm-password" name="confirmPassword" type="password" placeholder="Nhập lại mật khẩu mới" minlength="8" />
                </div>
              </div>
            </div>

            <p id="fp-status" class="error" role="alert"></p>
            <p id="fp-success" class="success" role="status"></p>

            <button id="request-otp-button" class="primary-button" type="submit">
              <span class="button-label">Tạo OTP</span>
            </button>
            <button id="verify-otp-button" class="primary-button hidden" type="button">
              <span class="button-label">Xác thực</span>
            </button>
            <button id="reset-password-button" class="primary-button hidden" type="button">
              <span class="button-label">Đổi mật khẩu</span>
            </button>
          </form>

          <div class="auth-signup auth-signup-inline">
            <span>Đã nhớ mật khẩu?</span>
            <button type="button" class="support-button" id="back-to-login">Đăng nhập</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById('forgot-password-form');
      const usernameInput = document.getElementById('fp-username');
      const phoneInput = document.getElementById('fp-phone');
      const otpStep = document.getElementById('otp-step');
      const newPasswordStep = document.getElementById('new-password-step');
      const otpInput = document.getElementById('fp-otp');
      const newPasswordInput = document.getElementById('fp-new-password');
      const confirmPasswordInput = document.getElementById('fp-confirm-password');
      const statusBox = document.getElementById('fp-status');
      const successBox = document.getElementById('fp-success');
      const requestButton = document.getElementById('request-otp-button');
      const verifyButton = document.getElementById('verify-otp-button');
      const resetButton = document.getElementById('reset-password-button');
      const backToLoginButton = document.getElementById('back-to-login');
      const otpNote = document.getElementById('fp-otp-note');

      const setStatus = (message, type = 'error') => {
        statusBox.textContent = type === 'error' ? message : '';
        successBox.textContent = type === 'success' ? message : '';
      };

      const showStep = (step) => {
        otpStep.classList.toggle('hidden', step !== 'otp');
        newPasswordStep.classList.toggle('hidden', step !== 'reset');
        requestButton.classList.toggle('hidden', step !== 'request');
        verifyButton.classList.toggle('hidden', step !== 'otp');
        resetButton.classList.toggle('hidden', step !== 'reset');
      };

      backToLoginButton.addEventListener('click', () => {
        window.location.assign('/login.html');
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = usernameInput.value.trim();
        const phone = phoneInput.value.trim();

        if (!username || !phone) {
          setStatus('Vui lòng nhập tên đăng nhập và số điện thoại.', 'error');
          return;
        }

        setStatus('', 'success');
        requestButton.disabled = true;

        try {
          const response = await fetch('/api/forgot-password/request', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, phone })
          });
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || 'Không thể tạo OTP.');
          }

          if (result.otp) {
            otpNote.textContent = `Mã OTP mẫu: ${result.otp} (dùng trong môi trường dev)`;
          }
          showStep('otp');
          setStatus('Mã OTP đã được tạo. Vui lòng nhập mã xác thực.', 'success');
          otpInput.focus();
        } catch (error) {
          setStatus(error.message || 'Không thể tạo OTP.', 'error');
        } finally {
          requestButton.disabled = false;
        }
      });

      verifyButton.addEventListener('click', async () => {
        const username = usernameInput.value.trim();
        const phone = phoneInput.value.trim();
        const otp = otpInput.value.trim();

        if (!otp) {
          setStatus('Vui lòng nhập mã OTP.', 'error');
          return;
        }

        try {
          const response = await fetch('/api/forgot-password/verify', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, phone, otp })
          });
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || 'Xác thực OTP không thành công.');
          }

          showStep('reset');
          setStatus('', 'success');
          newPasswordInput.focus();
        } catch (error) {
          setStatus(error.message || 'Xác thực OTP không thành công.', 'error');
        }
      });

      resetButton.addEventListener('click', async () => {
        const username = usernameInput.value.trim();
        const phone = phoneInput.value.trim();
        const otp = otpInput.value.trim();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!newPassword || !confirmPassword) {
          setStatus('Vui lòng nhập mật khẩu mới và xác nhận mật khẩu.', 'error');
          return;
        }
        if (newPassword.length < 8) {
          setStatus('Mật khẩu mới phải có ít nhất 8 ký tự.', 'error');
          return;
        }
        if (newPassword !== confirmPassword) {
          setStatus('Mật khẩu xác nhận không trùng khớp.', 'error');
          return;
        }

        try {
          const response = await fetch('/api/forgot-password/reset', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, phone, otp, newPassword })
          });
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || 'Không thể đổi mật khẩu.');
          }

          setStatus(result.message || 'Đổi mật khẩu thành công.', 'success');
          showStep('request');
          form.reset();
          setTimeout(() => window.location.assign('/login.html'), 1600);
        } catch (error) {
          setStatus(error.message || 'Không thể đổi mật khẩu.', 'error');
        }
      });

      showStep('request');
    </script>
  </body>
</html>
