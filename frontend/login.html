<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Manager | Đăng nhập</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/login.css?v=20260930-sakura" />
  </head>
  <body class="login-page">
    <main class="auth-layout">
      <section class="brand-panel">
        <div class="brand-topline"><img src="/assets/sakura-mark.svg" alt="" /><span>Quản lý<br />khách sạn</span></div>
        <div class="brand-copy">
          <h1>Chào mừng trở lại</h1>
          <p>Khởi đầu một ngày phục vụ tận tâm.</p>
        </div>
      </section>
      <section class="auth-panel">
        <div class="auth-card">
          <div class="auth-mark" aria-hidden="true"><img src="/assets/sakura-mark.svg" alt="" /></div>
          <div class="auth-heading">
            <h2 id="auth-title">Đăng nhập</h2>
          </div>
          <p id="auth-subtitle" class="auth-subtitle">
            Chào mừng bạn đến với hệ thống quản lý khách sạn
          </p>

          <form id="login-form">
            <div class="field-group hidden" id="full-name-group">
              <label for="full-name">Họ và tên</label>
              <div class="input-wrap">
                <span class="field-icon" aria-hidden="true">👤</span>
                <input
                  id="full-name"
                  name="fullName"
                  type="text"
                  autocomplete="name"
                  placeholder="Nguyễn Văn An"
                />
              </div>
            </div>

            <div class="field-group">
              <label for="email">Email</label>
              <div class="input-wrap">
                <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 6 9 7 9-7"/></svg></span>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="Nhập địa chỉ email"
                  required
                />
              </div>
            </div>

            <div class="field-group">
              <label for="password">Mật khẩu</label>
              <div class="input-wrap">
                <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></svg></span>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="••••••••"
                  required
                />
                <button
                  class="password-toggle"
                  id="password-toggle"
                  type="button"
                  aria-label="Hiện mật khẩu" aria-pressed="false"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
                </button>
              </div>
            </div>

            <div class="field-group hidden" id="confirm-password-group">
              <label for="confirm-password">Xác nhận mật khẩu</label>
              <div class="input-wrap">
                <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></svg></span>
                <input
                  id="confirm-password"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Nhập lại mật khẩu"
                />
              </div>
            </div>

            <div class="field-row">
              <label class="remember-me" for="remember-me">
                <input id="remember-me" name="rememberMe" type="checkbox" value="true" />
                <span>Ghi nhớ đăng nhập</span>
              </label>
              <button type="button" class="helper-link" id="forgot-password">Quên mật khẩu?</button>
            </div>

            <p id="error-message" class="error" role="alert"></p>
            <p id="success-message" class="success" role="status"></p>

            <button id="submit-button" class="primary-button" type="submit">
              <span class="button-label">Đăng nhập</span>

            </button>
          </form>

          <div class="auth-tabs">
            <span>Cần hỗ trợ?</span>
            <button class="support-button" type="button" id="contact-admin">
              Liên hệ quản trị viên
            </button>
          </div>
        </div>
      </section>
    </main>
    <script src="/js/main.js?v=20260930-sakura" defer></script>
  </body>
</html>
