<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Hotel Manager</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">HOTEL MANAGER / DASHBOARD</p>
      <h1>Tổng quan</h1>
    </div>
    <div class="user-chip">
      <div><strong id="top-name">...</strong><small>Đang hoạt động</small></div>
      <div class="avatar" id="avatar">H</div>
      <button id="logout-button" class="secondary-button" type="button">Đăng xuất</button>
    </div>
  </header>
  <p id="logout-error" class="error" role="alert"></p>
  <main class="dashboard">
    <section class="welcome-block">
      <p class="eyebrow">GOOD MORNING / TODAY</p>
      <h2>Xin chào, <span id="full-name">...</span></h2>
      <p class="muted">Mọi thứ đang sẵn sàng cho một ngày vận hành suôn sẻ.</p>
    </section>
   <section class="rooms-section">
  <div class="rooms-header">
    <div>
      <p class="eyebrow">ROOM MANAGEMENT</p>

      <h2>Danh sách phòng</h2>

      <p class="muted">
        Theo dõi trạng thái và thời gian sử dụng của các phòng.
      </p>
    </div>

    <div class="room-legend">
      <span class="legend-item">
        <span class="legend-dot available"></span>
        Phòng trống
      </span>

      <span class="legend-item">
        <span class="legend-dot occupied"></span>
        Đã có người thuê
      </span>
    </div>
  </div>

  <div id="room-grid" class="room-grid">
    <!-- JavaScript sẽ hiển thị danh sách phòng ở đây -->
  </div>
</section>
  </main>
  <script src="/js/main.js" defer></script>
</body>
</html>
